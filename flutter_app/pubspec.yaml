name: streetbite
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  equatable: ^3.0.0
  google_maps_flutter: ^2.18.1
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  device_info_plus: ^13.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/streetbite_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/